<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기후 정상회의</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 국제회의장: 짙은 남색 의장석 + 밝은 회의 자료 카드. 온도는 파랑→주황→빨강으로만 표현한다. */
:root {
  color-scheme: light;
  --bg: #eef1f4;
  --paper: #ffffff;
  --ink: #18222b;
  --ink-soft: #55636e;
  --navy: #1b2c45;
  --navy-2: #2a4266;
  --un: #3a7bd5;
  --cool: #3a8ed1; --warm: #f0a12f; --hot: #d8432f;
  --ok: #2e7d4f; --alert: #c2412d;
  --line: #ccd5de;
  --font-display: "Do Hyeon", "Black Han Sans", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6; padding: 14px 14px 48px; }
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
body.hostmode .wrap { max-width: 1500px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: clamp(36px, 7vw, 58px); }
h2 { font-size: clamp(24px, 4.5vw, 32px); }
h3 { font-size: 21px; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--warm); outline-offset: 2px; }
[hidden] { display: none !important; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px clamp(14px, 3.5vw, 28px); }
.hero { border-top: 8px solid var(--navy); display: grid; gap: 12px; }
.eyebrow { font-size: 14px; font-weight: 700; color: var(--navy-2); letter-spacing: .04em; }
.note { font-size: 14px; color: var(--ink-soft); }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.btn { border: 2px solid var(--navy); background: var(--navy); color: #fff; border-radius: 9px; padding: 11px 20px; font-weight: 700; }
.btn:hover:not(:disabled) { background: var(--navy-2); }
.btn.ghost { background: transparent; color: var(--navy); }
.btn.ghost:hover:not(:disabled) { background: #e7ecf2; }
.btn.warm { background: var(--warm); border-color: #b66f0c; color: #3a2300; }
.btn.warm:hover:not(:disabled) { background: #f6b650; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
input { font: inherit; font-size: 20px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; color: var(--ink); width: 100%; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; background: #e3e8ee; color: var(--ink-soft); }
.pill.on { background: #e2f1e7; color: var(--ok); } .pill.off { background: #f8e4df; color: var(--alert); }
.msg { border-radius: 8px; padding: 10px 14px; font-weight: 500; }
.msg.ok { background: #e2f1e7; color: var(--ok); border: 1px solid #a9d3b7; }
.msg.bad { background: #f8e4df; color: var(--alert); border: 1px solid #e5b2a7; }
.msg.info { background: #eef4fc; color: #1f4f8f; border: 1px solid #bcd3f0; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 30; max-width: 92vw; text-align: center; }

/* 나라 */
.countries { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }
.ctry { border: 3px solid var(--line); background: #fff; border-radius: 12px; padding: 10px 12px; text-align: left; display: grid; gap: 4px; }
.ctry[aria-pressed="true"] { border-color: var(--navy); box-shadow: 0 0 0 3px #c9d6ea; }
.ctry .nm { font-family: var(--font-display); font-size: 22px; }
.flag { font-size: 24px; vertical-align: -3px; margin-right: 6px; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 7px; color: #fff; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.stat { background: #f4f6f9; border-radius: 8px; padding: 6px 8px; }
.stat b { display: block; font-family: var(--font-display); font-size: 24px; font-weight: 400; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-soft); }
.stance { background: #f4f6f9; border-left: 5px solid var(--navy-2); padding: 8px 12px; border-radius: 0 8px 8px 0; font-size: 15.5px; }

/* 선택 */
.levels { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.lv { border: 3px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 6px; text-align: center; display: grid; gap: 2px; }
.lv b { font-family: var(--font-display); font-size: 20px; font-weight: 400; }
.lv span { font-size: 12px; color: var(--ink-soft); }
.lv[aria-pressed="true"] { border-color: var(--navy); background: var(--navy); color: #fff; }
.lv[aria-pressed="true"] span { color: #d6e0ef; }
.preview { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 6px; font-size: 14.5px; }
.preview div { background: #f4f6f9; border-radius: 8px; padding: 6px 10px; }
.preview b { font-variant-numeric: tabular-nums; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 9px 14px; font-size: 16px; }
.opt.right { border-color: var(--ok); background: #e2f1e7; } .opt.wrong { border-color: var(--alert); background: #f8e4df; }

/* 선생님 화면 */
.host-top { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.room-code { font-family: var(--font-display); font-size: clamp(60px, 8vw, 104px); line-height: 1; color: var(--navy); letter-spacing: .06em; }
.qr { background: #fff; padding: 10px; border-radius: 10px; border: 1px solid var(--line); }
.qr img, .qr canvas { display: block; width: 210px; height: 210px; }
.stage { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 14px; align-items: start; }
.thermo { display: grid; gap: 8px; justify-items: center; text-align: center; }
.thermo svg { width: 100%; max-width: 230px; height: auto; }
.temp { font-family: var(--font-display); font-size: 58px; line-height: 1; font-variant-numeric: tabular-nums; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 16px; }
.tbl th, .tbl td { border-bottom: 1px solid var(--line); padding: 7px 8px; text-align: center; font-variant-numeric: tabular-nums; }
.tbl th { font-size: 13px; color: var(--ink-soft); font-weight: 700; background: #f4f6f9; }
.tbl td:first-child, .tbl th:first-child { text-align: left; }
.tbl .big { font-family: var(--font-display); font-size: 26px; }
.neg { color: var(--alert); font-weight: 700; } .pos { color: var(--ok); font-weight: 700; }
.kept { color: var(--ok); font-weight: 700; } .broke { color: var(--alert); font-weight: 700; }
.factcard { border-left: 6px solid var(--un); background: #f1f6fd; padding: 10px 14px; border-radius: 0 10px 10px 0; display: grid; gap: 4px; }
.impact { border-left: 6px solid var(--hot); background: #fdf1ee; padding: 10px 14px; border-radius: 0 10px 10px 0; }
.phasebar { display: flex; gap: 6px; flex-wrap: wrap; }
.phasebar span { padding: 4px 12px; border-radius: 999px; background: #e3e8ee; color: var(--ink-soft); font-weight: 700; font-size: 14px; }
.phasebar span.on { background: var(--navy); color: #fff; }
.bigclock { font-family: var(--font-display); font-size: 40px; font-variant-numeric: tabular-nums; }
.sbar { position: sticky; top: 0; z-index: 5; color: #fff; border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; box-shadow: 0 4px 10px rgba(0,0,0,.12); }
.sbar b { font-family: var(--font-display); font-size: 22px; font-weight: 400; }
.qlist { margin: 0; padding-left: 22px; display: grid; gap: 6px; font-size: 18px; }
@media (max-width: 1000px) { .stage { grid-template-columns: 1fr; } }
@media (max-width: 800px) { .host-top { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .stats { grid-template-columns: repeat(2, 1fr); } .levels { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>

  <section class="card" style="display:grid;gap:10px"><h3>지구 지식 문제 <span class="note">(모둠에서 한 번, 맞히면 +1동전)</span></h3><p style="font-weight:700">${esc(qq[0])}</p>
    <div class="opts">${order.map((k, n) => `<button type="button" class="opt${q ? (k === 0 ? " right" : (q.pick === k ? " wrong" : "")) : ""}" data-qk="${k}" ${q ? "disabled" : ""}>${"①②③④"[n]} ${esc(qq[1][k])}</button>`).join("")}</div>
    ${q ? `<div class="msg ${q.ok ? "ok" : "bad"}">${q.ok ? "정답! 결과 공개 때 1동전을 더 받습니다." : "아쉬워요. 정답을 확인하세요."} <span class="note">(${esc(q.by || "")})</span></div><p class="note">${esc(qq[2])}</p>` : ""}</section>${briefHTML()}`;
  body.querySelectorAll("[data-lv]").forEach(b => b.onclick = () => { SV.lv = +b.dataset.lv; studentDecide(r); });
  body.querySelectorAll("[data-fund]").forEach(b => b.onclick = () => { SV.fund = +b.dataset.fund; studentDecide(r); });
  $("saveDec").onclick = () => dbReq(`${rk()}/dec/r${r}/${ME.g}`, "PUT", { lv: SV.lv, fund: SV.fund, by: ME.n }).then(() => toast("결정을 제출했습니다.")).catch(() => toast("저장하지 못했습니다."));
  body.querySelectorAll("[data-qk]").forEach(b => b.onclick = () => { if (quizOf(r, ME.g)) return; const k = +b.dataset.qk; dbReq(`${rk()}/quiz/r${r}/${ME.g}`, "PUT", { ok: k === 0, pick: k, by: ME.n }).catch(() => toast("저장하지 못했습니다.")); });
}
function studentResult(r) {
  const res = resOf(r), body = $("sBody"); if (!res) { body.innerHTML = `<section class="card"><p>결과를 계산하는 중입니다…</p></section>`; return; }
  const x = res.c[ME.g];
  const kept = x.pl === null ? "공개 약속을 하지 않았습니다." : x.lv >= x.pl ? "약속을 지켰습니다." : "약속보다 적게 줄였습니다.";
  body.innerHTML = `<section class="card hero"><span class="eyebrow">제${r}차 회의 결과</span><h2>지구 기온 ${fmtT(res.T0)} → <span style="color:${tempCol(res.T1)}">${fmtT(res.T1)}</span></h2>
    <p>우리 결정: <b>${LV[x.lv].n}</b>${x.none ? " (제출하지 않아 자동 처리)" : ""} · ${kept}</p>
    <div class="preview"><div>수입 <b>+${x.inc}</b></div><div>감축 비용 <b>${x.cost ? "-" + x.cost : 0}</b></div><div>기금 <b>${x.fund ? "-" + x.fund : 0}</b></div><div>기후 피해 <b class="neg">${x.dmg ? "-" + x.dmg : 0}</b></div><div>기금 지원 <b class="pos">${x.aid ? "+" + x.aid : 0}</b></div><div>지식 보너스 <b>${x.quiz ? "+1" : 0}</b></div></div>
    <p style="font-size:20px">우리 동전 ${x.before} → <b>${x.after}</b></p></section>
  <section class="card" style="display:grid;gap:8px"><h3>모든 나라의 실제 결정</h3><table class="tbl"><tr><th>나라</th><th>약속</th><th>실제</th><th>동전</th></tr>${G.map(g => { const y = res.c[g]; return `<tr><td>${cname(g)}</td><td>${y.pl === null ? "-" : LV[y.pl].n}</td><td class="${y.pl !== null && y.lv < y.pl ? "broke" : ""}">${LV[y.lv].n}</td><td>${y.after}</td></tr>`; }).join("")}</table><p class="note">세계 배출량 ${res.E} · 다음 회의를 기다리는 동안 대표단끼리 다음 전략을 이야기해 보세요.</p></section>`;
}
function studentEnd() {
  const s = st(), stats = endStats(), me = stats.find(x => x.g === ME.g), rank = stats.indexOf(me) + 1;
  $("sBody").innerHTML = `<section class="card hero"><span class="eyebrow">최종 결과</span><h2>지구 기온 <span style="color:${tempCol(s.T)}">${fmtT(s.T)}</span> — ${s.T <= GOAL ? "목표 달성!" : "목표 실패"}</h2>
    <p>${cname(ME.g)}: 최종 동전 <b>${me.coins}</b> (${rank}위) · 약속 지킴 ${me.kept}/${me.promised} · 총 피해 ${me.dmg}</p>
    <table class="tbl"><tr><th>나라</th><th>동전</th><th>약속 지킴</th></tr>${stats.map(x => `<tr><td>${cname(x.g)}</td><td>${x.coins}</td><td>${x.kept}/${x.promised}</td></tr>`).join("")}</table>
    <p class="note">전자칠판의 '함께 생각해 보기' 질문으로 모둠 토의를 해 보세요.</p></section>`;
}

/* 시작 */
(function boot() { const hc = params.get("host"); if (hc && /^\d{4}$/.test(hc)) return openHost(hc); home(); })();
</script>
</body>
</html>
