<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>세계 지도 땅따먹기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 탐험 지도: 짙은 바다 위에 종이색 대륙. 모둠 색은 차지한 땅에만 쓴다. */
:root {
  color-scheme: light;
  --sea-1: #0f3a52; --sea-2: #1b5876; --sea-3: #2d7fa3;
  --bg: #e9f0f3; --paper: #ffffff; --ink: #16252d; --ink-soft: #55656e;
  --navy: #12364a; --navy-2: #1d5371; --gold: #f2b233; --alert: #c8402b; --ok: #24804e; --line: #c9d6dc;
  --font-display: "Do Hyeon", "Black Han Sans", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.55; padding: 12px 12px 40px; }
.wrap { max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; gap: 12px; }
body.hostmode .wrap { max-width: 1700px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.2; text-wrap: balance; }
h1 { font-size: clamp(38px, 7vw, 60px); } h2 { font-size: clamp(24px, 4.4vw, 32px); } h3 { font-size: 21px; }
p { margin: 0; }
button { font: inherit; cursor: pointer; color: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 18px clamp(14px, 3vw, 26px); }
.eyebrow { font-size: 13.5px; font-weight: 700; color: var(--navy-2); letter-spacing: .04em; }
.note { font-size: 14px; color: var(--ink-soft); }
.btn { border: 2px solid var(--navy); background: var(--navy); color: #fff; border-radius: 10px; padding: 11px 20px; font-weight: 700; }
.btn:hover:not(:disabled) { background: var(--navy-2); }
.btn.ghost { background: transparent; color: var(--navy); } .btn.ghost:hover:not(:disabled) { background: #e3edf1; }
.btn.gold { background: var(--gold); border-color: #b47c0a; color: #3a2700; } .btn.gold:hover:not(:disabled) { background: #f7c453; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
input { font: inherit; font-size: 20px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 9px; background: #fff; color: var(--ink); width: 100%; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; background: #e1e9ed; color: var(--ink-soft); }
.pill.on { background: #dff2e6; color: var(--ok); } .pill.off { background: #f9e2dc; color: var(--alert); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 3px solid var(--line); background: #fff; border-radius: 10px; padding: 7px 14px; min-width: 64px; font-weight: 700; text-align: center; }
.chip small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.chip[aria-pressed="true"] { color: #fff; } .chip[aria-pressed="true"] small { color: #fff; }
.msg { border-radius: 9px; padding: 10px 14px; font-weight: 500; }
.msg.ok { background: #dff2e6; color: #17603a; border: 1px solid #a5d4b6; }
.msg.bad { background: #f9e2dc; color: #a2301f; border: 1px solid #e6b0a4; }
.msg.info { background: #fff3d6; color: #7a4d00; border: 1px solid #efd28f; }
.toast { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 40; max-width: 92vw; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.3); }

/* 첫 화면 */
.hero { background: linear-gradient(160deg, var(--sea-1), var(--sea-2) 60%, var(--sea-3)); color: #fff; border: 0; display: grid; gap: 12px; position: relative; overflow: hidden; }
.hero .eyebrow { color: #bfe3f2; } .hero p { color: #e4f1f7; max-width: 60ch; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; }
.how { background: #f4f8fa; border-radius: 12px; padding: 12px 14px; display: grid; gap: 4px; }
.how b { font-family: var(--font-display); font-weight: 400; font-size: 20px; color: var(--navy); }
.how span { font-size: 14.5px; color: var(--ink-soft); }

/* 지도 */
.mapbox { position: relative; background: linear-gradient(180deg, #0f3a52, #1b5876 55%, #174a66); border-radius: 14px; overflow: hidden; border: 2px solid var(--navy); }
.mapbox svg { display: block; width: 100%; height: 100%; touch-action: none; user-select: none; -webkit-user-select: none; }
.mapbox.full { aspect-ratio: 2000 / 1050; }
.mapbox.phone { height: min(58vh, 92vw); min-height: 260px; }
.sphere { fill: #2a79a0; } .grat { fill: none; stroke: rgba(255,255,255,.13); stroke-width: 1; vector-effect: non-scaling-stroke; }
.land { stroke: #ffffff; stroke-width: 1.4; vector-effect: non-scaling-stroke; stroke-linejoin: round; transition: fill .35s; }
.land.can { stroke: #111; stroke-width: 2.6; stroke-dasharray: 7 5; animation: march 1s linear infinite; cursor: pointer; }
.land.fortable { cursor: pointer; }
.land.prot { stroke: #a8e4ff; stroke-width: 3.2; }
.land.sel { stroke: #fff; stroke-width: 4; stroke-dasharray: none; filter: drop-shadow(0 0 6px rgba(255,255,255,.9)); }
.land.pulse { animation: pulse 1s ease-out; }
@keyframes march { to { stroke-dashoffset: -24; } }
@keyframes pulse { 0% { filter: brightness(2.2) drop-shadow(0 0 0 #fff); } 40% { filter: brightness(1.6) drop-shadow(0 0 18px #fff); } 100% { filter: none; } }
.mesh { fill: none; stroke: rgba(255,255,255,.45); stroke-width: .6; vector-effect: non-scaling-stroke; pointer-events: none; }
.route { fill: none; stroke: #fff; stroke-width: 2; stroke-dasharray: 1 7; stroke-linecap: round; vector-effect: non-scaling-stroke; opacity: .85; pointer-events: none; }
.rlabel { fill: #cfe8f3; font-weight: 700; text-anchor: middle; pointer-events: none; }
.lb { text-anchor: middle; pointer-events: none; font-family: var(--font-display); paint-order: stroke; stroke-linejoin: round; }
.lb .lo { font-family: var(--font-body); font-weight: 700; }
.mark { pointer-events: none; }
.float { font-family: var(--font-display); text-anchor: middle; pointer-events: none; animation: floatup 1.4s ease-out forwards; paint-order: stroke; stroke: #fff; stroke-width: 4px; }
@keyframes floatup { 0% { opacity: 0; transform: translateY(8px); } 15% { opacity: 1; } 100% { opacity: 0; transform: translateY(-46px); } }
.mapctl { position: absolute; right: 8px; top: 8px; display: grid; gap: 6px; }
.mapctl button { width: 42px; height: 42px; border-radius: 10px; border: 0; background: rgba(255,255,255,.94); font-weight: 700; font-size: 20px; box-shadow: 0 2px 6px rgba(0,0,0,.25); }
.mapctl button.txt { font-size: 12.5px; line-height: 1.1; }
.banner { position: absolute; left: 50%; top: 12px; transform: translateX(-50%); background: rgba(255,255,255,.96); border-radius: 999px; padding: 8px 22px; font-family: var(--font-display); font-size: clamp(18px, 2vw, 30px); box-shadow: 0 6px 20px rgba(0,0,0,.35); white-space: nowrap; animation: bannerin 3.2s ease forwards; pointer-events: none; border: 4px solid #fff; }
@keyframes bannerin { 0% { opacity: 0; transform: translate(-50%, -20px); } 8% { opacity: 1; transform: translate(-50%, 0); } 85% { opacity: 1; } 100% { opacity: 0; } }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 13px; color: var(--ink-soft); }
.legend i { display: inline-block; width: 13px; height: 13px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid rgba(0,0,0,.2); }

/* 학생 화면 */
.sbar { color: #fff; border-radius: 12px; padding: 9px 14px; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 4px 14px; }
.sbar b { font-family: var(--font-display); font-size: 21px; font-weight: 400; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sbar .big { font-family: var(--font-display); font-size: 24px; font-variant-numeric: tabular-nums; }
.sbar small { display: block; font-size: 11.5px; opacity: .9; line-height: 1.1; }
.sbar .cell { text-align: right; }
.cdline { border-radius: 10px; padding: 8px 12px; font-weight: 700; background: #fff3d6; color: #7a4d00; border: 1px solid #efd28f; display: flex; gap: 10px; align-items: center; }
.cdline .bar { flex: 1; height: 8px; background: #f0dca8; border-radius: 99px; overflow: hidden; } .cdline .bar i { display: block; height: 100%; background: #d99a12; }
.sheet { border-left: 10px solid var(--line); display: grid; gap: 8px; padding: 14px 16px; }
.sheet h3 { display: flex; flex-wrap: wrap; gap: 8px; align-items: baseline; }
.tag { display: inline-block; font-family: var(--font-body); font-size: 12px; font-weight: 700; border-radius: 6px; padding: 1px 8px; color: #fff; background: var(--navy-2); }
.targets { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
.tgt { flex: 0 0 auto; border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 6px 12px; text-align: left; display: grid; }
.tgt b { font-size: 15.5px; white-space: nowrap; } .tgt span { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.tgt[aria-pressed="true"] { border-color: var(--navy); background: #eaf2f6; }
.mini { display: flex; gap: 6px; flex-wrap: wrap; }
.mini span { border-radius: 8px; padding: 2px 9px; color: #fff; font-weight: 700; font-size: 14px; font-variant-numeric: tabular-nums; }

/* 문제 창 */
.qwrap { position: fixed; inset: 0; z-index: 30; background: rgba(8,26,36,.62); display: grid; place-items: center; padding: 12px; }
.qcard { background: var(--paper); border-radius: 16px; width: min(660px, 100%); max-height: 100%; overflow-y: auto; padding: 18px clamp(14px, 4vw, 26px); display: grid; gap: 12px; border-top: 12px solid var(--navy); animation: pop .22s ease-out; }
@keyframes pop { from { transform: scale(.94); opacity: 0; } }
.qtile { font-size: 14px; font-weight: 700; color: var(--navy-2); }
.qtext { font-size: 20px; font-weight: 700; line-height: 1.5; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 11px; padding: 11px 14px; font-size: 17px; }
.opt:hover:not(:disabled) { border-color: var(--navy); }
.opt.right { border-color: var(--ok); background: #dff2e6; } .opt.wrong { border-color: var(--alert); background: #f9e2dc; }
.opt:disabled { cursor: default; }
.explain { background: #f2f7f9; border: 1px solid var(--line); border-radius: 9px; padding: 10px 14px; font-size: 15.5px; }

/* 선생님 화면 */
.host-top { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.room-code { font-family: var(--font-display); font-size: clamp(60px, 8vw, 110px); line-height: 1; color: var(--navy); letter-spacing: .06em; }
.qr { background: #fff; padding: 10px; border-radius: 12px; border: 1px solid var(--line); }
.qr img, .qr canvas { display: block; width: 210px; height: 210px; }
.host-play { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 12px; align-items: start; }
.side { display: grid; gap: 10px; }
.side .card { padding: 12px 16px; }
.bigtime { font-family: var(--font-display); font-size: 68px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--navy); }
.bigtime.low { color: var(--alert); animation: blink 1s steps(2) infinite; } @keyframes blink { 50% { opacity: .55; } }
.score { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.score li { position: relative; display: grid; grid-template-columns: 36px 1fr auto; align-items: center; gap: 10px; background: #f4f8fa; border-radius: 10px; padding: 6px 10px; overflow: hidden; }
.score li > * { position: relative; }
.score .fillbar { position: absolute; left: 0; top: 0; bottom: 0; opacity: .16; transition: width .5s; }
.score .sw { width: 36px; height: 36px; border-radius: 9px; color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-size: 21px; }
.score .pts { font-family: var(--font-display); font-size: 32px; font-variant-numeric: tabular-nums; }
.score .sub { font-size: 12.5px; color: var(--ink-soft); display: block; }
.conts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
.cont { border-radius: 8px; padding: 5px 4px; text-align: center; font-size: 12px; font-weight: 700; background: #eef3f5; color: var(--ink-soft); border: 2px solid transparent; }
.cont b { display: block; font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.feed { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14.5px; }
.feed li { border-left: 5px solid var(--line); padding: 2px 8px; background: #f4f8fa; border-radius: 0 6px 6px 0; }
.groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grp { background: #fff; border: 3px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.grp h3 { display: flex; align-items: center; gap: 8px; } .grp h3 i { width: 18px; height: 18px; border-radius: 5px; display: inline-block; }
.grp ul { margin: 4px 0 0; padding-left: 18px; font-size: 15px; }
.podium { display: flex; align-items: flex-end; justify-content: center; gap: 12px; min-height: 260px; padding-top: 10px; }
.pod { flex: 1 1 0; max-width: 190px; text-align: center; display: grid; gap: 4px; }
.pod .colm { border-radius: 12px 12px 0 0; color: #fff; display: grid; align-content: start; justify-items: center; padding-top: 10px; font-family: var(--font-display); font-size: 40px; animation: rise .9s cubic-bezier(.2,.8,.2,1) backwards; transform-origin: bottom; }
@keyframes rise { from { transform: scaleY(0); } }
.pod .nm { font-family: var(--font-display); font-size: 24px; } .pod .who { font-size: 13px; color: var(--ink-soft); }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.award { background: #f4f8fa; border-radius: 12px; padding: 10px 14px; } .award b { font-family: var(--font-display); font-size: 24px; font-weight: 400; display: block; }
.confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
.confetti i { position: absolute; top: -20px; width: 10px; height: 16px; border-radius: 2px; animation: fall linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }
@media (max-width: 1150px) { .host-play { grid-template-columns: 1fr; } }
@media (max-width: 800px) { .host-top { grid-template-columns: 1fr; } .groups { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>

  $("targets").innerHTML = cands.map(id => `<button type="button" class="tgt" data-pick="${id}" aria-pressed="${LOC.sel === id}" style="border-left:8px solid ${owner(id) ? GCOL[owner(id)] : LAND[T[id].u]}"><b>${esc(T[id].n)}${T[id].pt > 1 ? " ★2점" : ""}${tile(id).f ? " 🛡" : ""}</b><span>${USHORT[T[id].u]} · ${owner(id) ? owner(id) + "모둠 땅" : "빈 땅"}</span></button>`).join("") || `<span class="note">지금 도전할 수 있는 땅이 없습니다. 보호 시간이 끝나기를 기다리거나 우리 땅에 요새를 지으세요.</span>`;
  $("targets").querySelectorAll("[data-pick]").forEach(b => b.onclick = () => pickRegion(b.dataset.pick, true));
  $("hint").textContent = ready ? `도전할 수 있는 지역 ${cands.length}곳 — 깜박이는 곳을 누르세요.` : "쉬는 시간입니다. 지도를 살펴보며 다음 목표를 정하세요.";
  const rk = ranking(), cl = contLeaders();
  $("mini").innerHTML = rk.map(r => `<span style="background:${GCOL[r.g]};${r.g === ME.g ? "outline:3px solid #111" : ""}">${r.g}모둠 ${r.pts}</span>`).join("");
  const myCont = Object.keys(cl).filter(u => cl[u] === ME.g).map(u => USHORT[u]);
  $("myStat").textContent = `정답 ${LOC.ok} · 점령 ${LOC.cap}${myCont.length ? ` · 대륙 1위: ${myCont.join(", ")}` : ""}${isUnderdog(ME.g) ? " · 추격 중(쉬는 시간 절반)" : ""}`;
  drawSheet();
}
function pickRegion(id, focus) { LOC.sel = id; SP.mv.select(id); if (focus) { SP.mv.userMoved = true; SP.mv.fit([id, ...[...NB[id]].filter(n => owner(n) === ME.g)], 90); } refreshPlay(); const sh = $("sheet"); if (sh && sh.getBoundingClientRect().bottom > innerHeight) sh.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
function drawSheet() {
  const sh = $("sheet"); if (!sh) return; const id = LOC.sel; if (!id) { sh.hidden = true; return; }
  const t = T[id], o = owner(id), act = actionFor(id, ME.g), ready = cdLeft() <= 0;
  const sig = [id, o, tile(id).f, act.kind, act.no, ready].join("|"); if (sh.dataset.sig === sig && !sh.hidden) return; sh.dataset.sig = sig;
  sh.hidden = false; sh.style.borderLeftColor = o ? GCOL[o] : LAND[t.u];
  let btn = "";
  if (act.kind === "attack") btn = `<button class="btn gold" id="goAct" type="button" ${ready ? "" : "disabled"}>${act.fort ? "요새 공격하기" : o ? "빼앗기 도전" : "점령 도전"}</button>${act.fort ? `<span class="note">요새가 있어 두 번 맞혀야 빼앗을 수 있습니다.</span>` : ""}`;
  else if (act.kind === "fort") btn = `<button class="btn" id="goAct" type="button" ${ready ? "" : "disabled"}>요새 짓기 (문제 풀기)</button><span class="note">요새가 있으면 상대가 두 번 맞혀야 빼앗깁니다.</span>`;
  else btn = `<span class="note">${esc(act.no)}</span>`;
  sh.innerHTML = `<h3>${esc(t.n)} <span class="tag">${UNIT[t.u]}</span>${t.pt > 1 ? ` <span class="tag" style="background:#b47c0a">2점</span>` : ""}</h3><p>${esc(t.intro)}</p><p class="note">${o ? `<b style="color:${GCOL[o]}">${o}모둠</b>의 땅${tile(id).home ? " (본부)" : ""}${tile(id).f ? " · 요새 있음" : ""}` : "아직 주인이 없는 땅"}</p><div class="actions">${btn}</div>`;
  const b = $("goAct"); if (b) b.onclick = () => openQ(id);
}
function pickQuestion(id) {
  const u = T[id].u, idx = QB.map((q, i) => i);
  const tiers = [idx.filter(i => QB[i][0] === id), idx.filter(i => QB[i][0] === "U" + u)];
  for (const pool of tiers) { const fresh = pool.filter(i => !LOC.asked[i]); if (fresh.length) { const i = fresh[Math.floor(Math.random() * fresh.length)]; LOC.asked[i] = 1; return i; } }
  tiers[0].forEach(i => delete LOC.asked[i]); tiers[1].forEach(i => delete LOC.asked[i]);
  const i = tiers[0][Math.floor(Math.random() * tiers[0].length)]; LOC.asked[i] = 1; return i;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function openQ(id) {
  if (LOC.q) return; if (cdLeft() > 0) return toast("아직 쉬는 시간입니다.");
  const act = actionFor(id, ME.g); if (act.no) return toast(act.no);
  const t = T[id], qi = pickQuestion(id), q = QB[qi], order = shuffle([0, 1, 2, 3]);
  LOC.q = { id, qi, kind: act.kind };
  const title = act.kind === "fort" ? `${t.n}에 요새 짓기` : act.fort ? `${t.n}의 요새 공격` : `${t.n} ${owner(id) ? "빼앗기" : "점령"} 도전`;
  $("qlayer").innerHTML = `<div class="qwrap" role="dialog" aria-modal="true" aria-labelledby="qText"><div class="qcard" style="border-top-color:${GCOL[ME.g]}">
    <div class="qtile">${esc(title)} · ${UNIT[t.u]}</div>
    <p class="qtext" id="qText">${esc(q[1])}</p>
    <div class="opts">${order.map((k, n) => `<button type="button" class="opt" data-k="${k}">${"①②③④"[n]} ${esc(q[2][k])}</button>`).join("")}</div>
    <div id="qRes" style="display:grid;gap:10px"></div></div></div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k, b));
}
function closeQ() { LOC.q = null; const l = $("qlayer"); if (l) l.innerHTML = ""; }
async function answer(k, btn) {
  const cur = LOC.q; if (!cur || cur.done) return; cur.done = true;
  const q = QB[cur.qi], t = T[cur.id], right = k === 0;
  document.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (+b.dataset.k === 0) b.classList.add("right"); });
  if (!right) btn.classList.add("wrong");
  let html = "";
  if (right) {
    LOC.ok++; SFX.ok();
    const res = await resolve(cur.id);
    html = `<div class="msg ${res.cls}">${res.msg}</div><div class="explain">${esc(q[3])}</div>`;
    const sec = startCooldown(true);
    html += `<p class="note" id="qWait">${sec}초 뒤에 다시 도전할 수 있습니다.</p>`;
  } else {
    LOC.bad++; SFX.bad(); const sec = startCooldown(false);
    html = `<div class="msg bad">아쉬워요. 정답은 <b>${esc(q[2][0])}</b>입니다.</div><div class="explain">${esc(q[3])}</div><p class="note" id="qWait">${sec}초 뒤에 다시 도전할 수 있습니다.</p>`;
  }
  html += `<div class="actions"><button class="btn" id="qClose" type="button">지도로 돌아가기</button></div>`;
  $("qRes").innerHTML = html; LOC.wasReady = false;
  $("qClose").onclick = () => { closeQ(); refreshPlay(); }; $("qClose").focus();
  pushStats();
}
// 정답 뒤 실제 반영(쓰기 → 서버 결과 확인)
async function resolve(id) {
  const act = actionFor(id, ME.g), t = T[id], cur = tile(id), now = Math.round(nowS());
  if (act.no) return { cls: "info", msg: `정답! 하지만 그사이에 상황이 바뀌었습니다: ${esc(act.no)}` };
  let val, okMsg;
  if (act.kind === "fort") { val = { ...cur, f: 1, fby: ME.n }; okMsg = `정답! <b>${esc(t.n)}</b>에 요새를 지었습니다.`; }
  else if (act.fort) { val = { ...cur, f: 0, hby: ME.n, hg: ME.g, ht: now }; okMsg = `정답! <b>${esc(t.n)}</b>의 요새를 무너뜨렸습니다. 한 번 더 맞히면 빼앗을 수 있습니다.`; }
  else { val = { g: ME.g, t: now, by: ME.n }; okMsg = `정답! <b>${josa(esc(t.n), "을", "를")}</b> ${ME.g}모둠 땅으로 만들었습니다${cur.g ? ` (${cur.g}모둠에게서 빼앗음)` : ""}.`; }
  if (NET.role === "practice") { mirror.tiles[id] = val; }
  else {
    try { await dbReq(`rooms/${roomKey(NET.code)}/tiles/${id}`, "PUT", val); } catch (e) { return { cls: "bad", msg: "정답이지만 저장하지 못했습니다. 인터넷 연결을 확인하세요." }; }
    await new Promise(r => setTimeout(r, 700));   // 같은 순간 다른 모둠이 쓴 경우 서버의 최종 결과를 따른다
    const fin = tile(id);
    if (act.kind === "attack" && !act.fort && !(fin.g === ME.g && fin.t === now)) return { cls: "info", msg: `정답! 하지만 간발의 차로 ${fin.g || "다른"}모둠이 <b>${josa(esc(t.n), "을", "를")}</b> 차지했습니다.` };
  }
  if (act.kind === "attack" && !act.fort) { LOC.cap++; SFX.cap(); } else if (act.kind === "fort") SFX.fort();
  return { cls: "ok", msg: okMsg };
}
function pushStats() {
  if (NET.role === "practice") { const p = mirror.players.me; p.ok = LOC.ok; p.bad = LOC.bad; p.cap = LOC.cap; return; }
  dbReq(`rooms/${roomKey(NET.code)}/players/${NET.pid}`, "PATCH", { n: ME.n, g: ME.g, ok: LOC.ok, bad: LOC.bad, cap: LOC.cap }).catch(() => {});
}

/* =================== 혼자 연습(컴퓨터 모둠 3개와 대결) =================== */
let botNext = 0;
function startPractice() {
  if (es) { es.close(); es = null; }
  NET.role = "practice"; NET.code = null; skew = 0; ME.n = "나"; ME.g = 1; document.body.classList.remove("hostmode");
  mirror = { state: { phase: "play", id: Date.now(), ng: 4, endAt: Date.now() + 6 * 60000 }, tiles: homeTiles(4), players: { me: { n: "나", g: 1, ok: 0, bad: 0, cap: 0 }, b2: { n: "컴퓨터", g: 2 }, b3: { n: "컴퓨터", g: 3 }, b4: { n: "컴퓨터", g: 4 } } };
  onRoom = () => {}; botNext = Date.now() + 6000;
  studentShell(); toast("혼자 연습하기: 6분 동안 컴퓨터 모둠 3개와 겨룹니다.", 3500);
}
function botStep() {
  if (Date.now() < botNext) return; botNext = Date.now() + 4000 + Math.random() * 3000;
  const g = 2 + Math.floor(Math.random() * 3), c = IDS.filter(id => actionFor(id, g).kind === "attack"); if (!c.length || Math.random() < .3) return;
  const id = c[Math.floor(Math.random() * c.length)], cur = tile(id);
  mirror.tiles[id] = cur.f ? { ...cur, f: 0, hg: g } : { g, t: Math.round(nowS()), by: "컴퓨터" };
  renderStudent();
}

/* 시작 */
(function boot() { const hc = params.get("host"); if (hc && /^\d{4}$/.test(hc)) return openHost(hc); home(); })();
</script>
