<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>세계 지도 땅따먹기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* 탐험가의 해도(海圖) 느낌: 바다색 바탕 위 종이 카드, 모둠 색은 지도 위에서만 강하게 쓴다. */
:root {
  color-scheme: light;
  --sea: #cfe4ec;
  --sea-deep: #8fbccd;
  --paper: #fffdf7;
  --ink: #17252b;
  --ink-soft: #52646b;
  --navy: #143746;
  --navy-2: #1e4f63;
  --gold: #e9a23b;
  --alert: #c2412d;
  --ok: #2e7d4f;
  --line: #bcd0d6;
  --g1: #d1495b; --g2: #2e6fd8; --g3: #2f9e5b; --g4: #e07b12; --g5: #7b4fc9; --g6: #b5338a;
  --font-display: "Do Hyeon", "Black Han Sans", "Malgun Gothic", sans-serif;
  --font-body: "IBM Plex Sans KR", "Malgun Gothic", "Apple SD Gothic Neo", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--sea);
  background-image: radial-gradient(rgba(20,55,70,.07) 1px, transparent 1.5px);
  background-size: 22px 22px;
  color: var(--ink); font-family: var(--font-body); font-size: 17px; line-height: 1.6;
  padding: 14px 14px 48px;
}
.wrap { max-width: 860px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
body.hostmode .wrap { max-width: 1500px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font-size: clamp(36px, 7vw, 56px); }
h2 { font-size: clamp(24px, 4.5vw, 32px); }
h3 { font-size: 21px; }
p { margin: 0; }
button { font: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.card { background: var(--paper); border: 1px solid var(--line); border-radius: 12px; padding: 20px clamp(14px, 3.5vw, 28px); }
.hero { border-top: 8px solid var(--navy); display: flex; flex-direction: column; gap: 12px; }
.eyebrow { font-size: 14px; font-weight: 700; color: var(--navy-2); letter-spacing: .04em; }
.note { font-size: 14px; color: var(--ink-soft); }
.rules { margin: 0; padding-left: 20px; display: grid; gap: 4px; }
.btn { border: 2px solid var(--navy); background: var(--navy); color: #fff; border-radius: 9px; padding: 11px 20px; font-weight: 700; }
.btn:hover:not(:disabled) { background: var(--navy-2); }
.btn.ghost { background: transparent; color: var(--navy); }
.btn.ghost:hover:not(:disabled) { background: #e6f0f3; }
.btn.gold { background: var(--gold); border-color: #b97412; color: #3b2400; }
.btn.gold:hover:not(:disabled) { background: #f2b75a; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.split { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
input[type=text], input:not([type]) { font: inherit; font-size: 20px; padding: 8px 12px; border: 2px solid var(--ink); border-radius: 8px; background: #fff; color: var(--ink); width: 100%; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 3px solid var(--line); background: #fff; color: var(--ink); border-radius: 10px; padding: 8px 14px; min-width: 84px; font-weight: 700; text-align: center; }
.chip small { display: block; font-weight: 400; font-size: 12px; color: var(--ink-soft); }
.chip[aria-pressed="true"] { color: #fff; } .chip[aria-pressed="true"] small { color: #fff; }
.pill { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: 13px; font-weight: 700; background: #e3eaec; color: var(--ink-soft); }
.pill.on { background: #e2f1e7; color: var(--ok); } .pill.off { background: #f8e4df; color: var(--alert); }
.msg { border-radius: 8px; padding: 10px 14px; font-weight: 500; }
.msg.ok { background: #e2f1e7; color: var(--ok); border: 1px solid #a9d3b7; }
.msg.bad { background: #f8e4df; color: var(--alert); border: 1px solid #e5b2a7; }
.msg.info { background: #fff4dd; color: #7a4b05; border: 1px solid #f0d39a; }

/* 지도 */
.mapbox { background: linear-gradient(#bcdbe6, #a5cbd9); border: 2px solid var(--navy); border-radius: 12px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.mapbox svg { display: block; width: 100%; height: auto; }
.mapbox.small svg { min-width: 720px; }
.hex { stroke: #fff; stroke-width: 3; }
.tile { cursor: default; }
.tile.can { cursor: pointer; }
.tile.can .hex { stroke: #1b1b1b; stroke-width: 4; stroke-dasharray: 9 6; animation: march 1.2s linear infinite; }
@keyframes march { to { stroke-dashoffset: -30; } }
.tile .tn { font-family: var(--font-display); font-size: 17px; text-anchor: middle; pointer-events: none; }
.tile .ts { font-size: 11.5px; text-anchor: middle; pointer-events: none; }
.tile .badge { font-family: var(--font-display); font-size: 15px; text-anchor: middle; pointer-events: none; }
.route { stroke: #ffffff; stroke-width: 3; stroke-dasharray: 2 9; stroke-linecap: round; fill: none; opacity: .9; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--ink-soft); }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid rgba(0,0,0,.2); }

/* 학생 상단 줄 */
.sbar { position: sticky; top: 0; z-index: 5; color: #fff; border-radius: 10px; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 14px; box-shadow: 0 4px 10px rgba(0,0,0,.12); }
.sbar b { font-family: var(--font-display); font-size: 22px; font-weight: 400; }
.sbar .num { font-variant-numeric: tabular-nums; font-weight: 700; }
.timer { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.targets { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.tgt { border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 8px 10px; text-align: left; display: grid; gap: 2px; }
.tgt b { font-size: 16px; }
.tgt span { font-size: 12.5px; color: var(--ink-soft); }
.tgt:hover { border-color: var(--navy); }
.lockline { font-weight: 700; color: var(--alert); }

/* 문제 창 */
.qwrap { position: fixed; inset: 0; z-index: 20; background: rgba(12,30,38,.55); display: grid; place-items: center; padding: 14px; }
.qcard { background: var(--paper); border-radius: 14px; width: min(640px, 100%); max-height: 100%; overflow-y: auto; padding: 20px clamp(14px, 4vw, 28px); display: grid; gap: 12px; border-top: 10px solid var(--navy); }
.qtile { font-size: 14px; font-weight: 700; color: var(--navy-2); }
.qtext { font-size: 20px; font-weight: 700; line-height: 1.5; }
.opts { display: grid; gap: 8px; }
.opt { text-align: left; border: 2px solid var(--line); background: #fff; border-radius: 10px; padding: 10px 14px; font-size: 17px; }
.opt:hover:not(:disabled) { border-color: var(--navy); }
.opt.right { border-color: var(--ok); background: #e2f1e7; }
.opt.wrong { border-color: var(--alert); background: #f8e4df; }
.opt:disabled { cursor: default; }
.explain { background: #f1f6f7; border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; font-size: 15.5px; }

/* 선생님 화면 */
.host-top { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; }
.room-code { font-family: var(--font-display); font-size: clamp(60px, 8vw, 104px); line-height: 1; color: var(--navy); letter-spacing: .06em; }
.qr { background: #fff; padding: 10px; border-radius: 10px; border: 1px solid var(--line); }
.qr img, .qr canvas { display: block; width: 210px; height: 210px; }
.host-play { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 14px; align-items: start; }
.side { display: grid; gap: 12px; }
.bigtime { font-family: var(--font-display); font-size: 64px; line-height: 1; font-variant-numeric: tabular-nums; color: var(--navy); }
.bigtime.low { color: var(--alert); }
.score { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.score li { display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px; background: #fff; border: 1px solid var(--line); border-radius: 9px; padding: 6px 10px; }
.score .sw { width: 34px; height: 34px; border-radius: 8px; color: #fff; display: grid; place-items: center; font-family: var(--font-display); font-size: 20px; }
.score .pts { font-family: var(--font-display); font-size: 30px; font-variant-numeric: tabular-nums; }
.score .sub { font-size: 12.5px; color: var(--ink-soft); }
.feed { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 14.5px; }
.feed li { border-left: 5px solid var(--line); padding: 2px 8px; background: #fff; border-radius: 0 6px 6px 0; }
.groups { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.grp { background: #fff; border: 2px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.grp h3 { display: flex; align-items: center; gap: 8px; }
.grp h3 i { width: 18px; height: 18px; border-radius: 4px; display: inline-block; }
.grp ul { margin: 4px 0 0; padding-left: 18px; font-size: 15px; }
.podium { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.podium li { display: grid; grid-template-columns: 60px 44px 1fr auto; align-items: center; gap: 12px; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 19px; }
.podium .rk { font-family: var(--font-display); font-size: 34px; color: var(--navy); }
.podium li:first-child { border: 3px solid var(--gold); background: #fff8e8; }
.awards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.award { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
.award b { font-family: var(--font-display); font-size: 24px; font-weight: 400; display: block; }
.toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: var(--navy); color: #fff; padding: 10px 18px; border-radius: 999px; font-weight: 700; z-index: 30; max-width: 92vw; text-align: center; box-shadow: 0 6px 18px rgba(0,0,0,.25); }
@media (max-width: 1100px) { .host-play { grid-template-columns: 1fr; } }
@media (max-width: 800px) { .host-top { grid-template-columns: 1fr; } .groups { grid-template-columns: repeat(2, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<div id="qlayer"></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
/* 문제 은행: [단원, 문제, [정답, 오답1, 오답2, 오답3], 해설] — 비상교육 중학교 사회①(강창숙 외) Ⅱ~Ⅵ단원 */
const QB = [
/* Ⅱ. 아시아 (26~47쪽) */
[2, "다음 중 중앙아시아에 속하는 나라는?", ["카자흐스탄", "사우디아라비아", "타이", "네팔"], "중앙아시아에는 카자흐스탄·우즈베키스탄이 있습니다. 사우디아라비아는 서남아시아, 타이는 동남아시아, 네팔은 남부아시아입니다. (28~29쪽)"],
[2, "서남아시아의 아라비아반도 주변에 넓게 펼쳐진 지형은?", ["사막", "열대 우림", "빙하", "넓은 습지"], "서남아시아에는 아라비아반도 주변으로 사막이 펼쳐져 있고, 중앙아시아에는 초원과 사막이 분포합니다. (30쪽)"],
[2, "계절풍의 영향을 받는 아시아 지역의 여름 날씨로 알맞은 것은?", ["덥고 비가 많이 내린다", "춥고 건조하다", "서늘하고 눈이 많이 내린다", "1년 내내 비가 거의 오지 않는다"], "계절풍은 계절에 따라 방향이 바뀌는 바람으로, 그 영향을 받는 동남아시아·남부아시아 등은 여름에 덥고 비가 많이 내립니다. (30쪽)"],
[2, "중국과 주변 국가의 경계가 되는, 고도가 높고 험준한 산맥은?", ["히말라야산맥", "알프스산맥", "로키산맥", "안데스산맥"], "고도가 높고 험준한 히말라야산맥과 티베트고원은 중국과 주변 국가의 경계가 됩니다. (30쪽)"],
[2, "과거 동서 문물의 교통로인 실크로드의 중심지였던 도시는?", ["사마르칸트", "두바이", "방콕", "벵갈루루"], "우즈베키스탄의 사마르칸트는 실크로드의 중심지로 오래된 유적지가 많습니다. (29쪽)"],
[2, "사막 위에 세워져 현대적인 건축물을 많이 볼 수 있는 아랍에미리트의 도시는?", ["두바이", "사마르칸트", "베이징", "방콕"], "아랍에미리트의 두바이와 카타르의 도하는 사막 위에 세워진 도시로 현대적 건축물이 많습니다. (29쪽)"],
[2, "갠지스강을 성스러운 강으로 여기며, 인도의 카스트 제도에 영향을 준 종교는?", ["힌두교", "이슬람교", "불교", "크리스트교"], "힌두교도들은 갠지스강을 성스러운 강으로 여기며, 힌두교는 인도의 카스트 제도에 영향을 주었습니다. (33~34쪽)"],
[2, "율법에 따라 만든 '할랄' 음식만 먹고, 평생 한 번 메카 성지 순례를 해야 하는 종교는?", ["이슬람교", "힌두교", "불교", "크리스트교"], "이슬람교도는 할랄 음식만 먹을 수 있고, 평생에 한 번 이상 사우디아라비아의 메카로 성지 순례를 해야 합니다. (35쪽)"],
[2, "불교·힌두교·이슬람교·크리스트교의 공통점으로 옳은 것은?", ["모두 아시아에서 시작되어 주변으로 전파되었다", "모두 유럽에서 시작되었다", "모두 인도에서만 믿는다", "모두 같은 경전을 사용한다"], "네 종교는 모두 아시아에서 시작되어 주변 국가로 전파되었습니다. (32~35쪽)"],
[2, "힌두교도와 이슬람교도가 갈등하고 있는 아시아의 분쟁 지역은?", ["카슈미르", "카탈루냐", "스코틀랜드", "플랑드르"], "아시아의 종교 분쟁에는 이스라엘과 팔레스타인 분쟁, 카슈미르 분쟁 등이 있습니다. 나머지는 유럽의 분리 독립 요구 지역입니다. (36쪽)"],
[2, "종교 갈등을 줄이기 위한 노력으로 가장 알맞은 것은?", ["종교의 자유를 법으로 보장하고 서로의 문화를 존중한다", "한 종교만 믿도록 법으로 정한다", "다른 종교의 시설을 없앤다", "종교가 다른 사람과 교류하지 않는다"], "종교 갈등을 줄이려면 종교의 자유를 법으로 보장하고, 종교 문화의 차이를 이해하고 존중하는 태도가 중요합니다. (36~37쪽)"],
[2, "오늘날 아시아의 인구 특징으로 옳은 것은?", ["세계에서 가장 많은 사람이 사는 대륙이다", "세계에서 인구가 가장 적은 대륙이다", "모든 나라의 출생률이 높다", "다른 나라로 이주하는 사람이 없다"], "아시아는 인도·중국·인도네시아 등에 많은 사람이 살고 있는, 세계에서 인구가 가장 많은 대륙이며 국제 이주도 활발합니다. (38~39쪽)"],
[2, "다음 중 저출산·고령화 현상이 나타나는 아시아 국가는?", ["일본", "인도", "파키스탄", "필리핀"], "인도·파키스탄·필리핀 등은 출생률이 높고, 우리나라와 일본 등은 저출산·고령화 현상이 나타납니다. (39~40쪽)"],
[2, "아프가니스탄·시리아·미얀마 등에서 난민이 발생하는 주된 까닭은?", ["내전과 분쟁", "관광객 증가", "산업 구조의 고도화", "저출산"], "내전과 분쟁 등을 겪고 있는 아프가니스탄, 시리아, 미얀마 등에서는 난민이 발생하고 있습니다. (40~41쪽)"],
[2, "베트남·인도네시아 등이 빠르게 성장하고 있는 바탕은?", ["풍부한 노동력을 바탕으로 한 제조업", "세계적인 쌀 수입", "빙하 관광", "석유 수입 중계"], "베트남·인도네시아 등은 노동력이 풍부하여 제조업을 중심으로 성장하고 있고, 초국적 기업의 생산 공장이 잇따라 들어서고 있습니다. (43~44쪽)"],
[2, "인도에서 하이데라바드와 함께 소프트웨어 개발(첨단 산업)의 중심지로 성장한 도시는?", ["벵갈루루", "사마르칸트", "도하", "방콕"], "인도의 벵갈루루와 하이데라바드는 소프트웨어 개발의 중심지로 성장하고 있습니다. (44쪽)"],

function dbReq(path, method, val) {
  let url = `${DB}/${path}.json`;

  if (method !== "POST") url += `?x-http-method-override=${method}`;

  const h = merge => e => { try { const m = JSON.parse(e.data); applyAt(m.path, m.data, merge); setConn(true); onRoom(); } catch (err) {} };

function applyAt(path, data, merge) {
  const parts = path.split("/").filter(Boolean);

  const last = parts[parts.length - 1];
  if (merge) { if (!o[last] || typeof o[last] !== "object") o[last] = {}; for (const k in data) { if (data[k] === null) delete o[last][k]; else o[last][k] = data[k]; } }

const tilesOf = () => mirror.tiles || {};
const owner = id => (tilesOf()[id] || {}).g || 0;

  for (const id in tilesOf()) { const g = owner(id); if (sc[g] && T[id]) { sc[g].pts += T[id].pt; sc[g].n++; } }

  return sc;
}

function whyNot(id, g) {

function hexPath(x, y, r) { let d = ""; for (let i = 0; i < 6; i++) { const a = Math.PI / 180 * (60 * i - 30); d += (i ? "L" : "M") + (x + r * Math.cos(a)).toFixed(1) + " " + (y + r * Math.sin(a)).toFixed(1); } return d + "Z"; }

  TILES.forEach(t => {

    const upd = { "state": { phase: "lobby", id: Date.now() }, "tiles": homeTiles(), "feed": null };
    for (const pid in (mirror.players || {})) { upd[`players/${pid}/ok`] = 0; upd[`players/${pid}/bad`] = 0; upd[`players/${pid}/cap`] = 0; }
    await dbReq(`rooms/${roomKey(H.code)}`, "PATCH", upd).catch(() => alert("다시 시작하지 못했습니다."));
  };
  const w = $("hWipe"); if (w) w.onclick = async () => {
    if (!confirm("이 방의 기록을 모두 지울까요? 학생 화면도 처음으로 돌아갑니다.")) return;
    clearInterval(H.ticker); if (es) es.close();
    await dbReq(`rooms/${roomKey(H.code)}`, "DELETE").catch(() => {});
    try { localStorage.removeItem("wm-host"); } catch (e) {}
    history.replaceState(null, "", location.pathname + (params.get("db") ? "?db=" + encodeURIComponent(params.get("db")) : "")); params.delete("room"); home();
  };
}
function fillLobby() {
  const sc = scores(); let total = 0;
  $("lobbyGroups").innerHTML = GROUPS.map(g => { total += sc[g].members.length; return `<div class="grp" style="border-color:${GCOL[g]}"><h3><i style="background:${GCOL[g]}"></i>${g}모둠 <span class="note">${sc[g].members.length}명 · 본부 ${T[HOMES[g]].n}</span></h3><ul>${sc[g].members.map(p => `<li>${esc(p.n)}</li>`).join("") || '<li class="note" style="list-style:none;margin-left:-18px">아직 없음</li>'}</ul></div>`; }).join("");
  $("hostCount").textContent = `들어온 학생 ${total}명`;
}
function fillPlay() {
  const st = mirror.state || {};
  $("hostMap").innerHTML = mapSVG();
  const left = (st.endAt || 0) - nowS(); $("bigTime").textContent = mmss(left); $("bigTime").classList.toggle("low", left < 60000);
  $("scoreList").innerHTML = ranking().map(s => `<li><span class="sw" style="background:${GCOL[s.g]}">${s.g}</span><span><b>${s.g}모둠</b><span class="sub"> · 땅 ${s.n}칸 · 정답 ${s.ok}개 · ${s.members.length}명</span></span><span class="pts">${s.pts}</span></li>`).join("");
  const feed = Object.values(mirror.feed || {}).sort((a, b) => b.t - a.t).slice(0, 8);
  $("feedList").innerHTML = feed.map(f => `<li style="border-left-color:${GCOL[f.g]}"><b>${f.g}모둠</b> ${esc(f.by || "")} → <b>${esc((T[f.tid] || {}).n || "")}</b>${f.prev ? ` <span class="note">(${f.prev}모둠에게서)</span>` : ""}</li>`).join("") || `<li class="note">아직 점령한 땅이 없습니다.</li>`;
}
function fillEnd() {
  const rk = ranking();
  $("podium").innerHTML = rk.map((s, i) => `<li><span class="rk">${i + 1}위</span><span class="sw" style="width:44px;height:44px;border-radius:10px;background:${GCOL[s.g]};color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-size:24px">${s.g}</span><span><b>${s.g}모둠</b> <span class="note">땅 ${s.n}칸 · 정답 ${s.ok}개 · ${s.members.map(p => esc(p.n)).join(", ")}</span></span><span class="pts" style="font-family:var(--font-display);font-size:34px">${s.pts}점</span></li>`).join("");
  const ps = Object.values(mirror.players || {});
  const top = k => ps.slice().sort((a, b) => (b[k] || 0) - (a[k] || 0))[0];
  const ac = (p, key) => p && p[key] ? `${esc(p.n)} <span class="note">(${p.g}모둠)</span>` : "-";
  const acc = ps.filter(p => (p.ok || 0) + (p.bad || 0) >= 5).sort((a, b) => b.ok / (b.ok + b.bad) - a.ok / (a.ok + a.bad))[0];
  $("awards").innerHTML = `<div class="award"><span class="note">가장 많은 땅을 차지한 탐험왕</span><b>${ac(top("cap"), "cap")}</b><span class="note">${top("cap") ? (top("cap").cap || 0) + "칸" : ""}</span></div>
    <div class="award"><span class="note">정답을 가장 많이 맞힌 지리 박사</span><b>${ac(top("ok"), "ok")}</b><span class="note">${top("ok") ? (top("ok").ok || 0) + "문제" : ""}</span></div>
    <div class="award"><span class="note">정답률이 가장 높은 신중한 탐험가(5문제 이상)</span><b>${acc ? `${esc(acc.n)} <span class="note">(${acc.g}모둠)</span>` : "-"}</b><span class="note">${acc ? Math.round(acc.ok / (acc.ok + acc.bad) * 100) + "%" : ""}</span></div>`;
  $("endMap").innerHTML = mapSVG();
}

/* =================== 학생 =================== */
const ME = { n: "", g: 0 };
const LOC = { game: null, lockUntil: 0, asked: {}, ok: 0, bad: 0, cap: 0, q: null };
let sTick = 0;
function joinView(code) {
  NET.code = code; NET.pid = myPid(); NET.role = "student";
  let saved = null; try { saved = JSON.parse(localStorage.getItem("wm-me-" + code)); } catch (e) {}
  render(`<section class="card hero"><span class="eyebrow">방 ${code} · 세계 지도 땅따먹기 <span class="conn pill">연결 중</span></span><h2>모둠과 별명을 정하세요</h2>
    <label class="eyebrow" for="nick">별명(실명 대신)</label><input id="nick" maxlength="8" placeholder="예: 7번 번개" value="${esc(saved ? saved.n : "")}">
    <span class="eyebrow">우리 모둠</span><div class="chips" id="gChips"></div>
    <div class="actions"><button class="btn gold" id="join" type="button">입장하기</button><button class="btn ghost" id="back" type="button">처음으로</button></div>
    <p class="note" id="joinNote">선생님이 정해 준 모둠 번호를 고르세요.</p></section>`);
  let pick = saved ? saved.g : 0;
  const drawChips = () => { const sc = scores(); $("gChips").innerHTML = GROUPS.map(g => `<button type="button" class="chip" data-g="${g}" aria-pressed="${g === pick}" style="border-color:${GCOL[g]};${g === pick ? `background:${GCOL[g]}` : ""}">${g}모둠<small>${sc[g].members.length}명</small></button>`).join(""); document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { pick = +b.dataset.g; drawChips(); }); };
  subscribe(code, () => { if (!mirror.state) { $("joinNote") && ($("joinNote").textContent = "방을 찾을 수 없습니다. 방 번호를 확인하세요."); return; } if ($("gChips")) drawChips(); });
  drawChips();
  $("back").onclick = () => { if (es) es.close(); params.delete("room"); history.replaceState(null, "", location.pathname + (params.get("db") ? "?db=" + encodeURIComponent(params.get("db")) : "")); home(); };
  $("join").onclick = async () => {
    const n = $("nick").value.trim().slice(0, 8);
    if (!n) return toast("별명을 입력하세요.");
    if (!pick) return toast("모둠을 고르세요.");
    if (!mirror.state) return toast("방을 찾을 수 없습니다. 방 번호를 확인하세요.");
    ME.n = n; ME.g = pick;
    try { localStorage.setItem("wm-me-" + code, JSON.stringify(ME)); } catch (e) {}
    $("join").disabled = true;
    const prev = (mirror.players || {})[NET.pid] || {};
    try { await dbReq(`rooms/${roomKey(code)}/players/${NET.pid}`, "PATCH", { n, g: pick, ok: prev.ok || 0, bad: prev.bad || 0, cap: prev.cap || 0 }); }
    catch (e) { $("join").disabled = false; return toast("들어가지 못했습니다. 연결을 확인하세요."); }
    syncClock(); studentShell();
  };
}
function studentShell() {
  render(`<div id="sbar" class="sbar"></div><div id="sBody"></div>`);
  onRoom = renderStudent; renderStudent();
  clearInterval(sTick); sTick = setInterval(studentTick, 1000);
}
function studentTick() {
  const st = mirror.state || {};
  const el = $("sTime"); if (el && st.phase === "play") el.textContent = mmss(st.endAt - nowS());
  const lk = $("lockLine"); if (lk) { const l = LOC.lockUntil - Date.now(); lk.hidden = l <= 0; lk.textContent = `오답 대기 ${Math.ceil(l / 1000)}초 — 해설을 다시 읽어 보세요.`; if (l <= 0 && LOC.wasLocked) { LOC.wasLocked = false; renderStudent(true); } }
  const qw = $("qWait"); if (qw) { const l = LOC.lockUntil - Date.now(); if (l > 0) qw.textContent = `${Math.ceil(l / 1000)}초 뒤에 다른 땅에 도전할 수 있습니다.`; else { qw.textContent = "이제 다른 땅에 도전할 수 있습니다."; const b = $("qClose"); if (b) b.disabled = false; } }
  if (st.phase === "play" && (st.endAt - nowS()) <= 0 && NET.role === "practice") { mirror.state.phase = "end"; renderStudent(); }
  // 보호막 시간이 지나면 도전 가능 칸이 바뀌므로 다시 그림
  if (st.phase === "play" && !LOC.q && TILES.some(t => { const p = protLeft(t.id); return p <= 0 && p > -1100; })) renderStudent(true);
}
function renderStudent(fromTick) {
  if (!$("sbar")) return;
  const st = mirror.state;
  if (!st) { closeQ(); $("sbar").innerHTML = ""; $("sBody").innerHTML = `<section class="card"><h2>방이 닫혔습니다</h2><p>선생님이 방 기록을 지웠습니다.</p><div class="actions"><button class="btn" id="toHome" type="button">처음으로</button></div></section>`; $("toHome").onclick = () => { if (es) es.close(); params.delete("room"); home(); }; return; }
  if (st.phase === "play" && LOC.game !== st.id) { LOC.game = st.id; LOC.asked = {}; LOC.lockUntil = 0; LOC.ok = 0; LOC.bad = 0; LOC.cap = 0; }
  const sc = scores(), mine = sc[ME.g], rk = ranking(), myRank = rk.findIndex(s => s.g === ME.g) + 1;
  $("sbar").style.background = GCOL[ME.g];
  $("sbar").innerHTML = `<b>${ME.g}모둠 · ${esc(ME.n)}</b><span>우리 점수 <span class="num">${mine.pts}</span>${st.phase !== "lobby" && myRank ? ` · ${myRank}위` : ""}</span><span>${st.phase === "play" ? `남은 시간 <span class="timer num" id="sTime">${mmss(st.endAt - nowS())}</span>` : st.phase === "end" ? "게임 끝" : "대기 중"}</span>`;
  const body = $("sBody");
  if (st.phase === "lobby") {
    closeQ();
    body.innerHTML = `<section class="card" style="display:grid;gap:8px"><h2>잠시 기다리세요</h2><p>선생님이 시작하면 지도가 열립니다. 우리 모둠 본부는 <b>${T[HOMES[ME.g]].n}</b>입니다.</p><p class="note">같은 모둠: ${mine.members.map(p => esc(p.n)).join(", ")}</p><div class="actions"><button class="btn ghost" id="reJoin" type="button">모둠·별명 바꾸기</button></div></section><section class="card"><div class="mapbox small">${mapSVG()}</div>${legendHTML()}</section>`;
    $("reJoin").onclick = () => joinView(NET.code);
    return;
  }
  if (st.phase === "end") {
    closeQ();
    body.innerHTML = `<section class="card hero"><span class="eyebrow">게임 끝</span><h2>${ME.g}모둠 ${myRank}위 · ${mine.pts}점</h2><p>내 기록: 정답 ${LOC.ok}개 · 오답 ${LOC.bad}개 · 점령 ${LOC.cap}칸</p><ol class="podium" style="margin-top:6px">${rk.map((s, i) => `<li style="grid-template-columns:44px 1fr auto;font-size:16px"><span class="rk" style="font-size:24px">${i + 1}위</span><span><b style="color:${GCOL[s.g]}">${s.g}모둠</b> <span class="note">땅 ${s.n}칸</span></span><b>${s.pts}점</b></li>`).join("")}</ol>${NET.role === "practice" ? `<div class="actions"><button class="btn" id="pAgain" type="button">다시 연습하기</button><button class="btn ghost" id="pHome" type="button">처음으로</button></div>` : ""}</section><section class="card"><div class="mapbox small">${mapSVG()}</div></section>`;
    if (NET.role === "practice") { $("pAgain").onclick = startPractice; $("pHome").onclick = home; }
    return;
  }
  // 진행 중
  const locked = LOC.lockUntil > Date.now(); LOC.wasLocked = locked;
  const cands = TILES.filter(t => canTake(t.id, ME.g)).sort((a, b) => (owner(a.id) ? 1 : 0) - (owner(b.id) ? 1 : 0) || a.u - b.u);
  const keepScroll = body.querySelector(".mapbox") ? body.querySelector(".mapbox").scrollLeft : null;
  body.innerHTML = `
    <section class="card" style="padding:12px;display:grid;gap:8px">
      <div class="row"><h3>도전할 땅 고르기</h3><span class="note">점선으로 깜박이는 칸을 누르세요</span></div>
      <p class="lockline" id="lockLine" ${locked ? "" : "hidden"}></p>
      <div class="mapbox small" id="sMap">${mapSVG({ g: locked ? 0 : ME.g })}</div>
      ${legendHTML()}
    </section>
    <section class="card" style="padding:12px;display:grid;gap:8px">
      <h3>지금 도전할 수 있는 땅 ${cands.length}곳</h3>
      <div class="targets">${cands.map(t => `<button type="button" class="tgt" data-pick="${t.id}" ${locked ? "disabled" : ""} style="border-left:8px solid ${owner(t.id) ? GCOL[owner(t.id)] : LAND[t.u]}"><b>${esc(t.n)}${t.pt > 1 ? " (2점)" : ""}</b><span>${UNIT[t.u]} 문제 · ${owner(t.id) ? owner(t.id) + "모둠 땅" : "빈 땅"}</span></button>`).join("") || `<p class="note">맞닿은 땅이 모두 보호 중입니다. 잠시 뒤 다시 확인하세요.</p>`}</div>
    </section>`;
  if (keepScroll !== null) $("sMap").scrollLeft = keepScroll;
  else { const hm = T[HOMES[ME.g]]; requestAnimationFrame(() => { const m = $("sMap"); if (m) m.scrollLeft = Math.max(0, hm.x / MAPW * m.scrollWidth - m.clientWidth / 2); }); }
  if (!fromTick) studentTick();
  body.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => openQ(b.dataset.pick));
  body.querySelectorAll(".tile").forEach(gEl => {
    const id = gEl.dataset.t;
    const go = () => { if (LOC.lockUntil > Date.now()) return toast("오답 대기 중입니다."); const w = whyNot(id, ME.g); if (w) toast(`${T[id].n}: ${w}`); else openQ(id); };
    gEl.addEventListener("click", go);
    gEl.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } });
  });
}
function pickQuestion(u) {
  const pool = QB.map((q, i) => i).filter(i => QB[i][0] === u);
  let fresh = pool.filter(i => !LOC.asked[i]);
  if (!fresh.length) { pool.forEach(i => delete LOC.asked[i]); fresh = pool; }
  const i = fresh[Math.floor(Math.random() * fresh.length)]; LOC.asked[i] = 1; return i;
}
function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function openQ(tid) {
  if (LOC.q) return;
  const w = whyNot(tid, ME.g); if (w) return toast(w);
  const t = T[tid], qi = pickQuestion(t.u), q = QB[qi];
  const order = shuffle([0, 1, 2, 3]);
  LOC.q = { tid, qi, order };
  $("qlayer").innerHTML = `<div class="qwrap" role="dialog" aria-modal="true" aria-labelledby="qText"><div class="qcard" style="border-top-color:${GCOL[ME.g]}">
    <div class="qtile">${esc(t.n)} 도전 · ${UNIT[t.u]}${owner(tid) ? ` · ${owner(tid)}모둠 땅` : ""}</div>
    <p class="qtext" id="qText">${esc(q[1])}</p>
    <div class="opts">${order.map((k, n) => `<button type="button" class="opt" data-k="${k}">${"①②③④"[n]} ${esc(q[2][k])}</button>`).join("")}</div>
    <div id="qRes"></div></div></div>`;
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.k, b));
  const f = document.querySelector(".opt"); if (f) f.focus();
}
function closeQ() { LOC.q = null; const l = $("qlayer"); if (l) l.innerHTML = ""; }
async function answer(k, btn) {
  const cur = LOC.q; if (!cur || cur.done) return; cur.done = true;
  const q = QB[cur.qi], t = T[cur.tid], right = k === 0;
  document.querySelectorAll(".opt").forEach(b => { b.disabled = true; if (+b.dataset.k === 0) b.classList.add("right"); });
  if (!right) btn.classList.add("wrong");
  let html = "";
  if (right) {
    LOC.ok++;
    const w = whyNot(cur.tid, ME.g);
    if (!w) {
      const prev = owner(cur.tid);
      LOC.cap++;
      await claim(cur.tid, prev);
      html = `<div class="msg ok">정답! <b>${esc(t.n)}</b>을(를) ${ME.g}모둠 땅으로 만들었습니다${prev ? ` (${prev}모둠에게서 빼앗음)` : ""}.</div>`;
    } else html = `<div class="msg info">정답! 하지만 그사이에 상황이 바뀌어 점령하지 못했습니다: ${esc(w)}</div>`;
    html += `<div class="explain">${esc(q[3])}</div><div class="actions"><button class="btn" id="qClose" type="button">지도로 돌아가기</button></div>`;
  } else {
    LOC.bad++; LOC.lockUntil = Date.now() + WRONG_WAIT * 1000;
    html = `<div class="msg bad">아쉬워요. 정답은 <b>${esc(q[2][0])}</b>입니다.</div><div class="explain">${esc(q[3])}</div><p class="lockline" id="qWait">${WRONG_WAIT}초 뒤에 다른 땅에 도전할 수 있습니다.</p><div class="actions"><button class="btn" id="qClose" type="button" disabled>지도로 돌아가기</button></div>`;
  }
  $("qRes").innerHTML = html;
  $("qClose").onclick = () => { closeQ(); renderStudent(); };
  if (right) $("qClose").focus();
  pushStats();
}
async function claim(tid, prev) {
  const v = { g: ME.g, t: Math.round(nowS()), by: ME.n };
  if (NET.role === "practice") { mirror.tiles[tid] = v; mirror.feed = mirror.feed || {}; mirror.feed["f" + Date.now()] = { g: ME.g, tid, by: ME.n, t: v.t, prev }; return; }
  try {
    await dbReq(`rooms/${roomKey(NET.code)}/tiles/${tid}`, "PUT", v);
    dbReq(`rooms/${roomKey(NET.code)}/feed`, "POST", { g: ME.g, tid, by: ME.n, t: v.t, prev: prev || 0 }).catch(() => {});
  } catch (e) { toast("저장하지 못했습니다. 인터넷 연결을 확인하세요."); }
}
function pushStats() {
  if (NET.role === "practice") { const p = mirror.players.me; p.ok = LOC.ok; p.bad = LOC.bad; p.cap = LOC.cap; return; }
  dbReq(`rooms/${roomKey(NET.code)}/players/${NET.pid}`, "PATCH", { n: ME.n, g: ME.g, ok: LOC.ok, bad: LOC.bad, cap: LOC.cap }).catch(() => {});
}

/* =================== 혼자 연습 =================== */
function startPractice() {
  if (es) { es.close(); es = null; }
  NET.role = "practice"; NET.code = null; skew = 0; ME.n = "연습"; ME.g = 1;
  mirror = { state: { phase: "play", id: Date.now(), endAt: Date.now() + 5 * 60000 }, tiles: homeTiles(), players: { me: { n: "연습", g: 1, ok: 0, bad: 0, cap: 0 } }, feed: {} };
  onRoom = () => {};
  studentShell();
  toast("혼자 연습하기: 5분 동안 1모둠으로 땅을 넓혀 보세요.");
}

/* 시작 */
(function boot() {
  const hostCode = params.get("host");
  if (hostCode && /^\d{4}$/.test(hostCode)) return openHost(hostCode);
  home();
})();
</script>
